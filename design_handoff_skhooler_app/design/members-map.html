<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member distribution</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Manrope", system-ui, sans-serif; font-weight: 600; color: #201e1d;
    background: #f5ead8; overflow: hidden;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  svg { display: block; width: 100%; height: 100%; }
  path.country { stroke: #f5ead8; stroke-width: .6; transition: fill .12s ease; }
  path.country.hit:hover { stroke: #201e1d; stroke-width: 1.2; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s ease;
    background: #201e1d; color: #f5ead8; padding: 10px 13px; border-radius: 10px;
    font-size: 12px; line-height: 1.45; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.22);
  }
  #tip b { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; letter-spacing: -.02em; font-size: 14px; display: block; }
  #tip span { color: rgba(245,234,216,.7); }
  #legend { position: absolute; left: 14px; bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: #6b625c; }
  #legend .sw { display: flex; gap: 3px; }
  #legend .sw i { width: 22px; height: 9px; border-radius: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="map" role="img" aria-label="Member distribution by country"></svg>
  <div id="tip"></div>
  <div id="legend">
    <span>Fewer</span>
    <span class="sw"></span>
    <span>More</span>
  </div>
</div>
<script>
const TOTAL = 4182;
const RAW = {
  "United States of America": 430, "Ghana": 604, "Nigeria": 511, "India": 300, "Kenya": 210,
  "South Africa": 168, "Germany": 122, "France": 110, "Canada": 96, "Philippines": 84,
  "Brazil": 72, "Spain": 58, "Poland": 48, "Netherlands": 40, "Portugal": 34, "Egypt": 28,
  "Pakistan": 24, "Australia": 20, "Ireland": 17, "Mexico": 14, "Indonesia": 11,
  "Argentina": 9, "Italy": 8, "Romania": 6, "Morocco": 6, "Sweden": 5, "Vietnam": 4,
  "Turkey": 3, "Singapore": 2, "Japan": 2, "Colombia": 2, "New Zealand": 2
};
const rest = Object.values(RAW).reduce((a, b) => a + b, 0);
RAW["United Kingdom"] = TOTAL - rest;

const RAMP = ["#f4e6e9", "#e8d0d5", "#d2a6ae", "#a5636f", "#6b2334"];
const EMPTY = "#ece6dc";
const counts = Object.values(RAW);
const scale = d3.scaleThreshold()
  .domain([25, 75, 200, 450])
  .range(RAMP);

d3.select("#legend .sw").selectAll("i").data(RAMP).join("i").style("background", d => d);

const svg = d3.select("#map");
const gRoot = svg.append("g");
const tip = document.getElementById("tip");
let features = null;

function share(n) { return (n / TOTAL * 100).toFixed(n / TOTAL < 0.01 ? 1 : 0) + "%"; }

function draw() {
  if (!features) return;
  const w = document.getElementById("wrap").clientWidth;
  const h = document.getElementById("wrap").clientHeight;
  svg.attr("viewBox", [0, 0, w, h]);
  const projection = d3.geoNaturalEarth1().fitExtent([[8, 14], [w - 8, h - 26]], { type: "FeatureCollection", features });
  const path = d3.geoPath(projection);
  gRoot.selectAll("path.country")
    .data(features, d => d.id)
    .join("path")
    .attr("class", d => "country" + (RAW[d.properties.name] ? " hit" : ""))
    .attr("d", path)
    .attr("fill", d => RAW[d.properties.name] ? scale(RAW[d.properties.name]) : EMPTY);
}

gRoot.on("mousemove", (event) => {
  const target = event.target;
  const d = d3.select(target).datum();
  const n = d && d.properties ? RAW[d.properties.name] : null;
  if (!n) { tip.style.opacity = 0; return; }
  const online = Math.max(1, Math.round(n * 0.033));
  const joined = Math.max(1, Math.round(n * 0.052));
  tip.innerHTML = "<b>" + d.properties.name + "</b>" +
    n.toLocaleString() + " members <span>· " + share(n) + " of the group</span><br>" +
    online + " online now <span>· +" + joined + " this month</span>";
  const wrap = document.getElementById("wrap").getBoundingClientRect();
  const x = Math.min(event.clientX - wrap.left + 14, wrap.width - tip.offsetWidth - 8);
  const y = Math.max(8, event.clientY - wrap.top - tip.offsetHeight - 12);
  tip.style.transform = "translate(" + x + "px," + y + "px)";
  tip.style.opacity = 1;
});
gRoot.on("mouseleave", () => { tip.style.opacity = 0; });

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  features = topojson.feature(topo, topo.objects.countries).features
    .filter(f => f.properties.name !== "Antarctica");
  draw();
});
window.addEventListener("resize", draw);
</script>
</body>
</html>
